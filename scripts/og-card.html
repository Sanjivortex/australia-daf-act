<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #142530; color: #ecebec; font-family: "Readex Pro", Arial, sans-serif; position: relative; overflow: hidden; }
  .iso { position: absolute; right: -90px; top: -40px; width: 560px; opacity: .14; }
  .wrap { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .logo { height: 46px; width: auto; align-self: flex-start; }
  .eyebrow { margin-top: 54px; color: #ff5050; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; font-size: 22px; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 34px; height: 3px; background: #ff5050; }
  h1 { font-weight: 500; font-size: 62px; line-height: 1.08; margin: 18px 0 0; max-width: 900px; color: #fff; letter-spacing: -.01em; }
  h1 span { color: #ff5050; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font-size: 22px; color: #b8c0c6; }
  .pill { border: 2px solid #ff5050; color: #ff5050; border-radius: 999px; padding: 8px 18px; font-weight: 500; font-size: 20px; }
</style>
</head>
<body>
  <img class="iso" src="assets/brand/redbelly-isotype-red.svg" alt="">
  <div class="wrap">
    <img class="logo" src="assets/brand/redbelly-horizontal-negative.svg" alt="Redbelly">
    <div class="eyebrow">Plain-language explainer</div>
    <h1>Australia's Digital Assets Framework Act: <span>what it means for Tokeniser</span></h1>
    <div class="foot">
      <span>Who needs a licence · Key dates · Issuers · Redbelly fit</span>
      <span class="pill">Not legal advice</span>
    </div>
  </div>
</body>
</html>
